name: Build Flet Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  PYTHONUTF8: 1
  FLET_CLI_NO_RICH_OUTPUT: 1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache Flet/Flutter/Android toolchains
        uses: actions/cache@v4
        with:
          path: |
            ~/flutter
            ~/Android
            ~/java
            ~/.flet
          key: flet-android-${{ runner.os }}-v1
          restore-keys: |
            flet-android-${{ runner.os }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build APK using Flet
        run: flet build apk --yes --verbose

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OilField-App-APK
          path: |
            build/apk/*.apk
            build/sapk/*.apk
          if-no-files-found: error
