name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # ------------------------------------------------------------------
      # 1) تحرير مساحة القرص — استبدلنا jlumbroso/free-disk-space@main
      #    (إصدار غير مثبَّت + قد يفشل بسرعة كما حدث في تشغيلاتك الأخيرة،
      #    والتي انتهت خلال ~40 ثانية فقط، بينما هذا الإجراء يستغرق عادة
      #    4-5 دقائق عند نجاحه الفعلي — دليل قوي على فشله المبكر)
      #    بأمر bash بسيط ومضمون السلوك (مُختبَر سابقاً ووصل لبناء ناجح).
      # ------------------------------------------------------------------
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk-bundle \
                      /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune -af || true
          df -h

      # ------------------------------------------------------------------
      # 2) جافا (JDK 17) — Gradle لا يعمل بدونها إطلاقاً عند بناء أندرويد
      # ------------------------------------------------------------------
      - name: Set up Java (JDK 17)
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: frontend/pyproject.toml

      # ------------------------------------------------------------------
      # 3) تثبيت أداة Flet CLI فقط على الـ runner
      #    ملاحظة: لا نُثبّت frontend/requirements.txt هنا عمداً؛
      #    Flet يقرأ هذا الملف بنفسه ويحزّم اعتمادياته داخل تطبيق
      #    أندرويد النهائي.
      # ------------------------------------------------------------------
      - name: Install Flet CLI
        run: |
          pip install --upgrade pip
          pip install "flet[all]"
          flet --version

      # ------------------------------------------------------------------
      # 4) البناء الفعلي داخل مجلد frontend المعزول تماماً عن الخادم
      #    --yes يمنع أي طلب موافقة تفاعلي يعلّق التنفيذ
      # ------------------------------------------------------------------
      - name: Build APK with Flet
        working-directory: frontend
        run: flet build apk --yes --verbose
        env:
          FLET_CLI_NO_RICH_OUTPUT: "1"
          PYTHONUTF8: "1"

      # ------------------------------------------------------------------
      # 5) تحديد موقع ملف الـ APK فعلياً — Flet لا يضمن دائماً نفس المسار
      # ------------------------------------------------------------------
      - name: Locate and collect APK(s)
        run: |
          set -e
          mkdir -p artifact-output
          mapfile -t APKS < <(find frontend -type f -name "*.apk" 2>/dev/null)

          if [ "${#APKS[@]}" -eq 0 ]; then
            echo "::error::لم يتم العثور على أي ملف APK."
            echo "محتوى مجلد البناء (لأغراض التشخيص):"
            find frontend/build -maxdepth 5 2>/dev/null || echo "مجلد build غير موجود"
            exit 1
          fi

          echo "تم العثور على ${#APKS[@]} ملف/ملفات APK:"
          printf '%s\n' "${APKS[@]}"
          for f in "${APKS[@]}"; do cp "$f" artifact-output/; done

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: oilfield-app-apk
          path: artifact-output/*.apk
          if-no-files-found: error
          retention-days: 14
